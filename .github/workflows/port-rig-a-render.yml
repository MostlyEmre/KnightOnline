# Reference rig A: Windows D3D9 renders produced on a GPU-less GitHub runner by
# Microsoft's WARP software rasterizer. These are the images the macOS renderer
# is compared against.

name: "Port: rig A (Windows/WARP reference renders)"

on:
  workflow_dispatch:
  push:
    branches:
      - macos-port
    paths:
      - '.github/workflows/port-rig-a-render.yml'
      - 'port/rigs/rig-a/**'
      - 'port/spikes/ffspike/**'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # Fixed-function D3D9 scene (no assets) rendered through both routes to WARP:
  # the default adapter (Basic Render Driver) and D3D9On12 on an explicit WARP12 device.
  ffspike:
    runs-on: windows-latest
    name: "D3D9 fixed-function spike on WARP"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'false'

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Record the display adapters
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force rig-a-out | Out-Null
          Get-CimInstance Win32_VideoController | Format-List Name, DriverVersion, VideoProcessor, AdapterCompatibility, CurrentHorizontalResolution, CurrentVerticalResolution | Tee-Object rig-a-out/adapters.txt
          Start-Process dxdiag -ArgumentList '/t', "$PWD\rig-a-out\dxdiag.txt" -Wait
          query session | Tee-Object rig-a-out/session.txt

      - name: Build the spike
        shell: cmd
        run: |
          cl /nologo /std:c++20 /EHsc /W3 /WX /O2 /DUNICODE /D_UNICODE ^
            port\spikes\ffspike\d3d9_main.cpp ^
            /Fe:ffspike.exe ^
            /link d3d9.lib d3d12.lib dxgi.lib user32.lib

      - name: Render (default adapter, then D3D9On12 + WARP), twice each
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          foreach ($path in 'native', '9on12warp') {
            foreach ($run in 1, 2) {
              .\ffspike.exe --path $path --out "rig-a-out/ffspike-$path-run$run.png" 2>&1 | Tee-Object "rig-a-out/ffspike-$path-run$run.log"
              "exit code: $LASTEXITCODE" | Tee-Object -Append "rig-a-out/ffspike-$path-run$run.log"
            }
          }
          Get-FileHash rig-a-out/*.png -Algorithm SHA256 | Format-Table -AutoSize | Out-String -Width 200 | Tee-Object rig-a-out/hashes.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rig-a-ffspike
          path: rig-a-out

  # The real upstream client, unmodified, started on the runner to see whether its
  # D3D9 device comes up on WARP and the login scene renders.
  client:
    runs-on: windows-latest
    name: "Upstream client on WARP (login screen)"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'false'

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: lukka/get-cmake@latest

      - name: Configure and build the client
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DOPENKO_BUILD_SERVERS=OFF `
            -DOPENKO_BUILD_TOOLS=OFF `
            -DOPENKO_BUILD_CLIENT_TOOLS=OFF `
            -DOPENKO_BUILD_TESTS=OFF `
            -DOPENKO_FETCH_CLIENT_ASSETS=ON
          cmake --build build --parallel --target WarFare

      - name: Start the client and capture the screen
        shell: pwsh
        run: pwsh -File port/rigs/rig-a/run-client-capture.ps1 -ClientDir build/ClientData -Exe build/bin/Release/KnightOnLine.exe -OutDir rig-a-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rig-a-client
          path: rig-a-out
