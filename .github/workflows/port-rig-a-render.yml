# Reference rig A: Windows D3D9 renders produced on a GPU-less GitHub runner by
# Microsoft's WARP software rasterizer. These are the images the macOS renderer
# is compared against.

name: "Port: rig A (Windows/WARP reference renders)"

on:
  workflow_dispatch:
  push:
    branches:
      - macos-port
    paths:
      - '.github/workflows/port-rig-a-render.yml'
      - 'port/rigs/rig-a/**'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # The real upstream client, unmodified, started on the runner to see whether its
  # D3D9 device comes up on WARP and the login scene renders.
  client:
    runs-on: windows-latest
    name: "Upstream client on WARP (login screen)"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'false'

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: lukka/get-cmake@latest

      - name: Configure and build the client
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DOPENKO_BUILD_SERVERS=OFF `
            -DOPENKO_BUILD_TOOLS=OFF `
            -DOPENKO_BUILD_CLIENT_TOOLS=OFF `
            -DOPENKO_BUILD_TESTS=OFF `
            -DOPENKO_FETCH_CLIENT_ASSETS=ON
          cmake --build build --parallel --target WarFare

      # The client links d3dx9_43.dll, which only ships in the legacy DirectX
      # End-User Runtime (not preinstalled on the runner image).
      - name: Install the DirectX June 2010 runtime
        shell: pwsh
        run: |
          $url = 'https://download.microsoft.com/download/8/4/A/84A35BF1-DAFE-4AE8-82AF-AD2AE20B6B14/directx_Jun2010_redist.exe'
          Invoke-WebRequest $url -OutFile dxredist.exe
          Start-Process .\dxredist.exe -ArgumentList '/Q', "/T:$PWD\dxredist" -Wait
          Start-Process .\dxredist\DXSETUP.exe -ArgumentList '/silent' -Wait
          Get-ChildItem C:\Windows\System32\d3dx9_43.dll, C:\Windows\SysWOW64\d3dx9_43.dll | Format-Table FullName, Length

      - name: Start the client and capture the screen
        shell: pwsh
        run: pwsh -File port/rigs/rig-a/run-client-capture.ps1 -ClientDir build/ClientData -Exe build/bin/Release/KnightOnLine.exe -OutDir rig-a-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rig-a-client
          path: rig-a-out
